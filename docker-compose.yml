version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: eco-postgres
    environment:
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: eco_password
      POSTGRES_DB: eco
    ports:
      - "5432:5432"
    volumes:
      - eco-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eco-redis
    ports:
      - "6379:6379"

volumes:
  eco-postgres:
